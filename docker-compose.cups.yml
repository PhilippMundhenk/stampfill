# Overlay: a CUPS server next to stampfill for printers that do not accept PDF over IPP
# (most home printers only take raster formats; CUPS converts). Start with:
#   docker compose -f docker-compose.yml -f docker-compose.cups.yml up -d
# then register the printer once (driverless "IPP Everywhere"; use the printer's IP, mDNS names do not
# resolve inside containers):
#   docker compose exec cups lpadmin -p Office -E -v ipp://192.168.1.50/ipp/print -m everywhere
# and enter  http://cups:631/printers/Office  as the printer URL in stampfill's Settings.
#
# CUPS is deliberately NOT published on the network: whoever controls the queue receives every printed
# form. Administer it with "docker compose exec cups lpadmin ...". If you need the web interface, add
#   ports: ["127.0.0.1:631:631"]
# and reach it through an SSH tunnel. CUPSPASSWORD must be set in .env.
services:
  cups:
    image: olbat/cupsd:latest@sha256:3a9d7c319f4153c87e16db4edb6ef6c317aa7e71f8abe65c3419cc9aca851194
    restart: unless-stopped
    environment:
      CUPSADMIN: ${CUPSADMIN:-print}
      CUPSPASSWORD: ${CUPSPASSWORD:?set CUPSPASSWORD in .env}
    volumes:
      - cups-config:/etc/cups
    healthcheck:
      test: ["CMD-SHELL", "lpstat -r | grep -q running"]
      interval: 30s
      timeout: 5s
      retries: 3

  stampfill:
    depends_on:
      cups:
        condition: service_started

volumes:
  cups-config:
